stages:
  - test
  - deploy
  - docker

variables:
  NODE_VERSION: "22"
  IMAGE_NAME: ghcr.io/lariya-aa/surge-rule-studio

# ── Test stage ──────────────────────────────────────────────
test:
  stage: test
  image: node:${NODE_VERSION}-alpine
  script:
    - npm ci --prefer-offline
    - npm run test
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# ── Deploy to Cloudflare Workers ────────────────────────────
deploy:
  stage: deploy
  image: node:${NODE_VERSION}-alpine
  script:
    - npm ci --prefer-offline
    - npm run build
    # Remove placeholder D1 binding (not used by the app)
    - sed -i 's/"d1_databases":\[{"binding":"DB","database_name":"site-creator-d1","database_id":"00000000-0000-4000-8000-000000000000"}\]/"d1_databases":[]/' dist/server/wrangler.json
    - npx wrangler deploy --config dist/server/wrangler.json
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  environment:
    name: production
    url: https://surge-rule-studio.${CLOUDFLARE_ACCOUNT_ID}.workers.dev

# ── Build & push Docker image to GitHub Container Registry ──
docker:
  stage: docker
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "${GITHUB_TOKEN}" | docker login ghcr.io -u Lariya-aa --password-stdin
  script:
    - docker build -t ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} -t ${IMAGE_NAME}:latest .
    - docker push ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}
    - docker push ${IMAGE_NAME}:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
