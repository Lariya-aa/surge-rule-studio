stages:
  - test
  - deploy
  - docker

variables:
  NODE_VERSION: "22"
  IMAGE_NAME: ghcr.io/lariya-aa/surge-rule-studio

# ── Test stage ──────────────────────────────────────────────
test:
  stage: test
  image: node:${NODE_VERSION}-alpine
  script:
    - npm ci --prefer-offline
    - npm run test
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# ── Deploy to Cloudflare Workers ────────────────────────────
deploy:
  stage: deploy
  image: node:${NODE_VERSION}-alpine
  script:
    - npm ci --prefer-offline
    - npm run build
    # Remove placeholder D1 binding (not used by the app)
    - sed -i 's/"d1_databases":\[{"binding":"DB","database_name":"site-creator-d1","database_id":"00000000-0000-4000-8000-000000000000"}\]/"d1_databases":[]/' dist/server/wrangler.json
    - npx wrangler deploy --config dist/server/wrangler.json
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  environment:
    name: production
    url: https://surge-rule-studio.${CLOUDFLARE_ACCOUNT_ID}.workers.dev

# ── Build & push Docker image to GitHub Container Registry (kaniko) ──
docker:
  stage: docker
  before_script:
    # Download kaniko executor if not cached
    - |
      if [ ! -f /tmp/kaniko/executor ]; then
        mkdir -p /tmp/kaniko
        curl -fsSL "https://github.com/GoogleContainerTools/kaniko/releases/latest/download/executor" -o /tmp/kaniko/executor
        chmod +x /tmp/kaniko/executor
      fi
    - mkdir -p /tmp/kaniko/.docker
    - echo "{\"auths\":{\"ghcr.io\":{\"auth\":\"$(echo -n "Lariya-aa:${GITHUB_TOKEN}" | base64)\"}}}" > /tmp/kaniko/.docker/config.json
  script:
    - /tmp/kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"
      --destination "${IMAGE_NAME}:latest"
      --cache=true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
